omated rules, behavior verified with evidence, and human reviewers kept on the decisions that matter.","datePublished":"2026-10-21","url":"https://www.instagram.com/aryansarcade/p/DexAs67E9dz/","author":{"@id":"https://aryansarcade.in/#aryan"},"keywords":"AI CODING"}},{"@type":"ListItem","position":3,"item":{"@type":"SocialMediaPosting","headline":"Fintech funding is getting more selective.","text":"Global fintech startups raised $10.6B in Q3 2026, down 21.4% year on year, across the fewest rounds since 2018. Investors now want traction, growth and a path to profitability, and AI that delivers measurable results, not just an AI label. (Source: Crunchbase News.)","datePublished":"2026-10-22","url":"https://www.instagram.com/aryansarcade/p/DezsGUek-CK/","author":{"@id":"https://aryansarcade.in/#aryan"},"keywords":"STARTUPS"}},{"@type":"ListItem","position":4,"item":{"@type":"SocialMediaPosting","headline":"The real bill for AI comes due in watts, not dollars.","text":"AI looks cheap because VCs are footing the bill. After the model race comes the energy race. Whoever controls power controls compute.","datePublished":"2026-10-12","url":"https://x.com/Aryansarcde/status/2109522003996836047","author":{"@id":"https://aryansarcade.in/#aryan"},"keywords":"AI & ENERGY"}},{"@type":"ListItem","position":5,"item":{"@type":"SocialMediaPosting","headline":"7 lessons from Patrick Collison for young, ambitious builders.","text":"Go deep, not wide. Learn relentlessly. Work hard on things you enjoy. Build relationships with people who challenge you. Create things even when the outcome is uncertain. Learn from people who've done it. Don't wait for the perfect time to start.","datePublished":"2026-10-19","url":"https://www.instagram.com/aryansarcade/p/DeswNFGE_PC/","author":{"@id":"https://aryansarcade.in/#aryan"},"keywords":"GROWTH"}},{"@type":"ListItem","position":6,"item":{"@type":"SocialMediaPosting","headline":"Just bought my first domain.","text":"Yeah, I know, I'm late. But \"be
